[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yoctotui"
version = "0.1.0"
description = "A terminal cockpit for Yocto, BitBake, kas and container workflows"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Luca Padovan", email = "padovan.93@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["textual>=1.0,<2"]

[project.urls]
Homepage = "https://padovanl.github.io/bitloom/"
Repository = "https://github.com/padovanl/bitloom"
Issues = "https://github.com/padovanl/bitloom/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
docs = ["pillow>=10", "cairosvg>=2.7", "markdown-it-py>=3"]

[project.scripts]
bitloom = "yoctotui.cli:main"
yoctotui = "yoctotui.cli:main"

[tool.setuptools.packages.find]
include = ["yoctotui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
