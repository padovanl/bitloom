name: Release Bitloom

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version without v prefix (for example 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create a draft release (publish it manually after review)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bitloom-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Stable releases come from main
        if: ${{ !inputs.prerelease && github.ref != 'refs/heads/main' }}
        run: |
          echo "Stable releases are cut from main (this run is on ${GITHUB_REF}). Run from main, or tick 'pre-release'." >&2
          exit 1
      - name: Validate version and reject existing tags
        run: |
          python -c 'import os; from tools.build_release import release_version; release_version(os.environ["RELEASE_VERSION"])'
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}"; then
            echo 'This release tag already exists. Choose a new version.' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Install build and test dependencies
        run: python -m pip install -e '.[dev]' build wheel
      - name: Test
        run: python -m pytest -q
      - name: Build source archive, wheel, Debian package and bitloom.pyz
        run: python tools/build_release.py "$RELEASE_VERSION" --output dist/release
      - name: Verify Debian installation
        run: |
          sudo dpkg -i "dist/release/bitloom_${RELEASE_VERSION}_all.deb"
          cd /tmp
          /usr/bin/bitloom --help
          test "$(/usr/bin/bitloom --version | head -n 1)" = "bitloom ${RELEASE_VERSION}"
          python3 -c 'import json, sys; d = json.load(open("/usr/share/doc/bitloom/sbom.spdx.json")); assert {p["name"] for p in d["packages"]} >= {"bitloom", "textual", "rich"}' 
          /usr/bin/python3 -c 'import os, sys; sys.path.insert(0, "/opt/bitloom/lib"); import bitloom; assert bitloom.__version__ == os.environ["RELEASE_VERSION"]'
      - name: Smoke test the installed package
        working-directory: /tmp
        run: |
          set -e
          export PYTHONPATH=/opt/bitloom/lib
          /usr/bin/python3 -c 'import bitloom.app, bitloom.web, bitloom.ci, bitloom.studio, bitloom.sbom, bitloom.sbom_settings, bitloom.fleet, bitloom.infra'
          /usr/bin/bitloom --list-actions | grep -q sbom-cve-recipe
          /usr/bin/python3 -c 'from pathlib import Path; from bitloom.cli import prepare_demo; prepare_demo(Path("/tmp/bitloom-smoke"))'
          # --doctor exits 2 when a check warns (no BitBake on the runner): both mean it ran.
          status=0; /usr/bin/bitloom --config /tmp/bitloom-smoke/demo/.bitloom/profiles.json --doctor || status=$?
          test "$status" -eq 0 -o "$status" -eq 2
          /usr/bin/python3 -c 'from pathlib import Path; from bitloom.models import Settings; from bitloom.sbom import sbom_report; s = Settings(Path("/tmp/bitloom-smoke/demo/.bitloom/profiles.json")); p = next(p for p in s.profiles if p.name == "demo-wrynose"); text = sbom_report(p); assert "SPDX 3" in text, text'
      - name: The build service starts from the Debian package and from bitloom.pyz
        working-directory: /tmp
        run: |
          set -e
          # Both keep Bitloom outside python3's own path: the service must still start (it is launched as a new process).
          (timeout 20 /usr/bin/bitloom --web --no-browser --port 18765 --state /tmp/svc-deb --config /tmp/bitloom-smoke/demo/.bitloom/profiles.json > /tmp/web-deb.log 2>&1 &)
          sleep 8
          /usr/bin/bitloom --state /tmp/svc-deb --service-status | grep -q '"pid"'
          PYZ="$GITHUB_WORKSPACE/dist/release/bitloom-${RELEASE_VERSION}.pyz"
          test "$(python3 "$PYZ" --version | head -n 1)" = "bitloom ${RELEASE_VERSION}"
          (timeout 20 python3 "$PYZ" --web --no-browser --port 18766 --state /tmp/svc-pyz --config /tmp/bitloom-smoke/demo/.bitloom/profiles.json > /tmp/web-pyz.log 2>&1 &)
          sleep 8
          python3 "$PYZ" --state /tmp/svc-pyz --service-status | grep -q '"pid"'
      - name: Keep the assets with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: bitloom-${{ inputs.version }}
          path: dist/release/
          if-no-files-found: error
      - name: Tag the released source
        # The tag points at a commit whose pyproject.toml and bitloom/__init__.py carry the version, so
        # installing from the tag or a checkout of it reports the same version as the assets.
        run: |
          python -c 'import os; from pathlib import Path; from tools.build_release import set_version; set_version(Path("."), os.environ["RELEASE_VERSION"])'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "Release ${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Bitloom ${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
      - name: Publish GitHub release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "v${RELEASE_VERSION}" dist/release/* \
            --verify-tag --title "Bitloom ${RELEASE_VERSION}" --generate-notes "${flags[@]}"
