# Yocto Project 6.0 "Wrynose" (LTS until April 2030). The combined poky
# repository ends with 5.x: from 6.0 bitbake, openembedded-core and meta-yocto
# are separate repositories. Commits are the yocto-6.0.2 tags (peeled: the
# commit an annotated tag points to, from `git ls-remote URL 'refs/tags/TAG^{}'`).
header:
  version: 14
build_system: openembedded
machine: qemux86-64
distro: poky
target: core-image-minimal
repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.2
    commit: acfe02fa38b5da9e6a36c6cedcf91d4fcbefbfbd
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0.2
    commit: 5d1aa5c806c061a2994f4decb59016610f093213
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    tag: yocto-6.0.2
    commit: 24c24cef5d1523fefe43a3e3d34667b37ae551f3
    layers:
      meta-poky:
      meta-yocto-bsp:
local_conf_header:
  cockpit-validation: |
    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j8"
    IMAGE_FSTYPES = "tar.bz2"
    INHERIT += "buildstats buildhistory"
    BUILDHISTORY_COMMIT = "1"
